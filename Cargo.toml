[package]
name = "composite_joystick"
version = "0.1.0"
edition = "2021"
rust-version = "1.65"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
clap = { version = "4.0.32", features = ["derive"] }
hex = "0.4.3"
itertools = "0.10.5"
evdev-rs = { version = "0.6.3", features = ["serde"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
xdg = "2.4.1"
crossbeam-channel = "0.5.6"
static_assertions = "1.1.0"
packed_struct = "0.10.1"

[build-dependencies]
patch-crate = "0.1"

[package.metadata.patch]
crates = ["evdev-rs"]

[patch.crates-io]
# Patched version of evdev-rs with extra enum values for EV_KEY codes
# that aren't in linux/input-event-codes.h (e.g., codes 266-271, 280-286, 300-302).
# You may or may not want this for your own configuration; it was necessary for mine
# because a few _really important_ buttons on some of my joysticks report codes
# in those unmapped gaps.
# The patch is applied automatically by build.rs using cargo-patch.
evdev-rs = { path = './target/patch/evdev-rs-0.6.3' }